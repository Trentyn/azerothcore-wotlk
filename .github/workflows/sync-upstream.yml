
name: Sync AzerothCore Upstream

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official AzerothCore
        run: |
          git remote add upstream https://github.com/azerothcore/azerothcore-wotlk.git
          git fetch upstream master

      - name: Update master
        run: |
          git merge --ff-only upstream/master
          git push origin master

      - name: Create update PR for develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head master \
            --title "Sync upstream AzerothCore" \
            --body "Official AzerothCore updates ready for review." \
            || echo "PR already exists or no updates needed."
